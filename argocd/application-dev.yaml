apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tropical-management-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ditasetyakurniawan-droid/tropical-management-gitops.git
    targetRevision: main
    path: apps/tropical-management/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: tropical-management-dev
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
# Automated sync is intentionally disabled during bootstrap.
# Enable it only after images, Vault injection, probes and policies are production-ready.
