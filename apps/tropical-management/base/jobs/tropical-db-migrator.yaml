apiVersion: batch/v1
kind: Job
metadata:
  name: tropical-db-migrator
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 240
  template:
    metadata:
      labels:
        app: tropical-db-migrator
    spec:
      serviceAccountName: tropical-management
      restartPolicy: Never
      containers:
        - name: tropical-db-migrator
          image: harbor-dt.co.id/devops-apps/tropical-db-migrator:dev
          imagePullPolicy: IfNotPresent
