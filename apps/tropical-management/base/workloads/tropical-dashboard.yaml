apiVersion: apps/v1
kind: Deployment
metadata:
  name: tropical-dashboard

spec:
  replicas: 1
  selector:
    matchLabels:
      app: tropical-dashboard
  template:
    metadata:
      labels:
        app: tropical-dashboard
    spec:
      terminationGracePeriodSeconds: 30
      serviceAccountName: tropical-management
      containers:
      - name: tropical-dashboard
        image: harbor-dt.co.id/devops-apps/tropical-dashboard:v1
        ports:
        - containerPort: 8080
        startupProbe:
          httpGet:
            path: /livez
            port: 8080
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 24
          successThreshold: 1
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8080
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 3
          successThreshold: 1
        livenessProbe:
          httpGet:
            path: /livez
            port: 8080
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3
          successThreshold: 1

        env:
        - name: SALES_SERVICE_URL
          value: http://tropical-sales:8080
        - name: AUDIT_SERVICE_URL
          value: http://tropical-audit:8080
        - name: INVENTORY_SERVICE_URL
          value: http://tropical-inventory:8080