apiVersion: apps/v1
kind: Deployment
metadata:
  name: tropical-dashboard
spec:
  template:
    spec:
      containers:
        - name: tropical-dashboard
          resources:
            requests:
              cpu: 25m
              memory: 48Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
